                            <button onClick={() => navigate('bidang', { bidang: selectedBidang })} className="bg-white px-4 py-2 rounded-full shadow-sm font-bold text-gray-600 hover:bg-gray-100 transition">
                                <i className="fas fa-arrow-left mr-2"></i> Kembali
                            </button>
                            <div className="bg-white px-4 py-2 rounded-full shadow-sm font-bold text-primary">
                                Aktiviti {currentGameIndex + 1} / {totalGames}
                            </div>
                        </div>

                        {/* Progress Bar */}
                        <div className="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                            <div className="bg-primary h-2.5 rounded-full transition-all duration-500" style={{ width: `${((currentGameIndex) / totalGames) * 100}%` }}></div>
                        </div>

                        <div className="bg-white rounded-3xl shadow-xl p-6 md:p-10 flex-grow flex flex-col bounce-in">
                            <h3 className="text-2xl md:text-3xl font-bold text-gray-800 mb-8 text-center border-b-2 pb-4">
                                {gameData.question}
                            </h3>
                            
                            <div className="flex-grow flex flex-col justify-center">
                                {gameData.type === 'quiz' && <QuizGame data={gameData} onComplete={handleGameComplete} key={currentGameIndex} />}
                                {gameData.type === 'match' && <MatchGame data={gameData} onComplete={handleGameComplete} key={currentGameIndex} />}
                                {gameData.type === 'sequence' && <SequenceGame data={gameData} onComplete={handleGameComplete} key={currentGameIndex} />}
                            </div>
                        </div>
                    </div>
                );
            };

            const handleGameComplete = (isSuccess) => {
                if (isSuccess) {
                    const isLastGame = currentGameIndex === selectedUnit.games.length - 1;
                    
                    const overlay = document.createElement('div');
                    overlay.className = "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 bounce-in";
                    overlay.innerHTML = `
                        <div class="bg-white p-8 rounded-3xl text-center shadow-2xl max-w-sm mx-4 border-4 border-green-500">
                            <div class="text-6xl mb-4">🌟</div>
                            <h2 class="text-3xl font-bold text-green-600 mb-2">Hebat!</h2>
                            <p class="text-gray-600 mb-6 font-bold">+10 Markah</p>
                            <button id="nextBtn" class="bg-green-500 text-white px-8 py-3 rounded-full font-bold text-xl hover:bg-green-600 w-full">
                                ${isLastGame ? 'Selesai Unit' : 'Seterusnya'}
                            </button>
                        </div>
                    `;
                    document.body.appendChild(overlay);
                    
                    document.getElementById('nextBtn').onclick = () => {
                        document.body.removeChild(overlay);
                        setScore(prev => prev + 10); 
                        
                        if (isLastGame) {
                            markUnitComplete(selectedUnit.id, 0); 
                            navigate('bidang', { bidang: selectedBidang });
                        } else {
                            setCurrentGameIndex(prev => prev + 1);
                        }
                    };
                }
            };

            const renderReport = () => (
                <div className="min-h-screen p-6 max-w-4xl mx-auto">
                    <button onClick={() => navigate('home')} className="mb-6 bg-white px-4 py-2 rounded-full shadow-sm font-bold text-gray-600 hover:bg-gray-100 transition">
                        <i className="fas fa-home mr-2"></i> Menu Utama
                    </button>

                    <div className="bg-white rounded-3xl shadow-xl p-8 bounce-in">
                        <h2 className="text-3xl font-black text-center text-primary mb-8 border-b-4 border-yellow-400 pb-4 inline-block mx-auto">Laporan Pencapaian Murid</h2>
                        
                        <div className="flex flex-col md:flex-row justify-around items-center mb-10 bg-gray-50 p-6 rounded-2xl">
                            <div className="text-center mb-6 md:mb-0">
                                <div className="text-5xl font-black text-yellow-500">{score}</div>
                                <div className="text-gray-600 font-bold uppercase tracking-wider text-sm mt-1">Jumlah Markah</div>
                            </div>
                            <div className="h-16 w-1 bg-gray-200 hidden md:block"></div>
                            <div className="text-center">
                                <div className="text-5xl font-black text-green-500">{completedUnits.length}</div>
                                <div className="text-gray-600 font-bold uppercase tracking-wider text-sm mt-1">Lencana Terkumpul</div>
                            </div>
                        </div>

                        <h3 className="text-xl font-bold text-gray-800 mb-4">Kemajuan Bidang (Latihan)</h3>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {syllabusData.map(bidang => {
                                const bidangUnitIds = bidang.units.map(u => u.id);
                                const completedInBidang = completedUnits.filter(id => bidangUnitIds.includes(id)).length;
                                const isFullyComplete = completedInBidang === bidang.units.length;
                                
                                return (
                                    <div key={bidang.id} className={`p-4 rounded-2xl border-2 text-center ${isFullyComplete ? 'border-yellow-400 bg-yellow-50' : 'border-gray-200 bg-gray-50'}`}>
                                        <div className={`text-4xl mb-2 ${isFullyComplete ? '' : 'grayscale opacity-50'}`}>🏆</div>
                                        <div className="font-bold text-gray-700">{bidang.title}</div>
                                        <div className="text-sm text-gray-500 mt-1">{completedInBidang} / {bidang.units.length} Unit</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            const renderExamMenu = () => (
                <div className="min-h-screen p-6 max-w-4xl mx-auto flex flex-col items-center">
                    <button onClick={() => navigate('home')} className="mb-6 self-start bg-white px-4 py-2 rounded-full shadow-sm font-bold text-gray-600 hover:bg-gray-100 transition">
                        <i className="fas fa-arrow-left mr-2"></i> Menu Utama
                    </button>

                    <div className="bg-white rounded-3xl shadow-xl p-8 w-full text-center bounce-in">
                        <div className="text-6xl mb-4">📝</div>
                        <h2 className="text-4xl font-black text-red-600 mb-2">Mod Peperiksaan</h2>
                        <p className="text-gray-600 mb-8 font-medium">Uji kefahaman kamu terhadap semua topik. Jawapan hanya akan disemak pada akhir peperiksaan.</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {examData.map((exam, index) => (
                                <div key={exam.id} className="border-4 border-gray-100 hover:border-red-400 rounded-2xl p-6 transition transform hover:-translate-y-1 bg-gray-50 text-left">
                                    <div className="flex justify-between items-start mb-4">
                                        <h3 className="text-2xl font-bold text-gray-800">{exam.title}</h3>
                                        <span className="bg-red-100 text-red-600 font-bold px-3 py-1 rounded-full text-sm">{exam.questions.length} Soalan</span>
                                    </div>
                                    <p className="text-gray-600 text-sm mb-6 h-12">{exam.desc}</p>
                                    <button 
                                        onClick={() => navigate('exam-engine', { exam })}
                                        className="w-full bg-red-500 text-white py-3 rounded-xl font-bold hover:bg-red-600 transition"
                                    >
                                        Mula Set {index + 1}
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderExamEngine = () => {
                if (!currentExam) return null;

                const qIndex = currentGameIndex; // Using currentGameIndex to track exam question
                const q = currentExam.questions[qIndex];
                const isLast = qIndex === currentExam.questions.length - 1;
                
                const handleOptionClick = (opt) => {
                    const newAnswers = [...examAnswers];
                    newAnswers[qIndex] = opt;
                    setExamAnswers(newAnswers);
                };

                const handleNext = () => {
                    if (isLast) {
                        navigate('exam-result');
                    } else {
                        setCurrentGameIndex(prev => prev + 1);
                    }
                };

                const handlePrev = () => {
                    if (qIndex > 0) setCurrentGameIndex(prev => prev - 1);
                };

                return (
                    <div className="min-h-screen p-4 md:p-6 max-w-4xl mx-auto flex flex-col">
                        <div className="flex justify-between items-center mb-6">
                            <span className="bg-white px-4 py-2 rounded-full shadow-sm font-bold text-gray-600">
                                {currentExam.title}
                            </span>
                            <div className="bg-white px-4 py-2 rounded-full shadow-sm font-bold text-red-500">
                                Soalan {qIndex + 1} / {currentExam.questions.length}
                            </div>
                        </div>

                        {/* Progress */}
                        <div className="w-full bg-gray-300 rounded-full h-2 mb-6 flex">
                            {currentExam.questions.map((_, i) => (
                                <div key={i} className={`flex-1 h-full border-r border-white last:border-0 ${examAnswers[i] ? 'bg-red-500' : (i === qIndex ? 'bg-red-300' : 'bg-transparent')}`}></div>
                            ))}
                        </div>

                        <div className="bg-white rounded-3xl shadow-xl p-6 md:p-10 flex-grow flex flex-col relative bounce-in">
                            <div className="absolute top-0 right-8 bg-gray-800 text-white px-4 py-1 rounded-b-lg font-bold text-sm tracking-wider uppercase">
                                {q.bidang}
                            </div>
                            
                            <h3 className="text-2xl md:text-3xl font-bold text-gray-800 mt-6 mb-8 text-center border-b-2 pb-4">
                                {q.question}
                            </h3>
                            
                            <div className="flex-grow flex flex-col justify-center space-y-4">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {q.options.map((opt, i) => {
                                        const isSelected = examAnswers[qIndex] === opt;
                                        const isJawi = q.isJawi || /[\u0600-\u06FF]/.test(opt);
                                        return (
                                            <button 
                                                key={i}
                                                onClick={() => handleOptionClick(opt)}
                                                className={`p-6 rounded-2xl text-xl font-bold transition-all border-2 
                                                    ${isSelected ? 'bg-red-100 border-red-500 text-red-700 shadow-md transform scale-105' : 'bg-gray-50 border-gray-200 text-gray-700 hover:bg-gray-100'} 
                                                    ${isJawi ? 'jawi-text text-center' : 'text-left'}`}
                                            >
                                                {opt}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="mt-10 flex justify-between">
                                <button 
                                    onClick={handlePrev}
                                    disabled={qIndex === 0}
                                    className={`px-6 py-3 rounded-full font-bold ${qIndex === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-gray-800 text-white hover:bg-gray-700'}`}
                                >
                                    Sebelumnya
                                </button>
                                
                                <button 
                                    onClick={handleNext}
                                    disabled={!examAnswers[qIndex] && !isLast} // Force answer unless it's last (prevent skipping, or allow skip? Let's force answer to prevent accidental skips)
                                    className={`px-8 py-3 rounded-full font-bold text-white transition ${!examAnswers[qIndex] ? 'bg-gray-300 cursor-not-allowed' : (isLast ? 'bg-green-500 hover:bg-green-600 pulse-correct' : 'bg-red-500 hover:bg-red-600')}`}
                                >
                                    {isLast ? 'Hantar Peperiksaan' : 'Seterusnya'}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderExamResult = () => {
                if (!currentExam) return null;

                let correctCount = 0;
                const weakFields = {};
                
                currentExam.questions.forEach((q, i) => {
                    if (!weakFields[q.bidang]) weakFields[q.bidang] = { total: 0, wrong: 0 };
                    weakFields[q.bidang].total += 1;
                    
                    if (examAnswers[i] === q.answer) {
                        correctCount++;
                    } else {
                        weakFields[q.bidang].wrong += 1;
                    }
                });

                const totalQ = currentExam.questions.length;
                const percentage = Math.round((correctCount / totalQ) * 100);
                
                let gradeMsg = "Cuba lagi!";
                let gradeColor = "text-red-500";
                if (percentage >= 80) { gradeMsg = "Cemerlang!"; gradeColor = "text-green-500"; }
                else if (percentage >= 50) { gradeMsg = "Baik!"; gradeColor = "text-yellow-500"; }

                const areasToImprove = Object.keys(weakFields).filter(field => weakFields[field].wrong > 0);

                return (
                    <div className="min-h-screen p-6 max-w-4xl mx-auto flex flex-col items-center">
                        <div className="bg-white rounded-3xl shadow-xl p-8 w-full bounce-in">
                            <h2 className="text-3xl font-black text-center text-gray-800 mb-2">Keputusan Peperiksaan</h2>
                            <h3 className="text-lg font-bold text-center text-gray-500 mb-8">{currentExam.title}</h3>
                            
                            <div className="flex flex-col items-center justify-center mb-10">
                                <div className={`text-6xl font-black ${gradeColor} mb-2`}>{percentage}%</div>
                                <div className={`text-2xl font-bold ${gradeColor}`}>{gradeMsg}</div>
                                <div className="text-gray-600 font-medium mt-2">Betul {correctCount} daripada {totalQ} soalan</div>
                            </div>

                            {areasToImprove.length > 0 && (
                                <div className="bg-red-50 p-6 rounded-2xl border-2 border-red-200 mb-8">
                                    <h4 className="font-bold text-red-800 mb-3 flex items-center"><i className="fas fa-exclamation-triangle mr-2"></i> Bidang Perlu Ulang Kaji:</h4>
                                    <div className="flex flex-wrap gap-2">
                                        {areasToImprove.map(field => (
                                            <span key={field} className="bg-white border border-red-300 text-red-600 px-3 py-1 rounded-full text-sm font-bold shadow-sm">
                                                {field} ({weakFields[field].wrong} Salah)
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <h4 className="font-bold text-gray-800 mb-4 text-xl border-b pb-2">Semakan Jawapan</h4>
                            <div className="space-y-4 mb-8 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                {currentExam.questions.map((q, i) => {
                                    const isCorrect = examAnswers[i] === q.answer;
                                    const isJawiAns = q.isJawi || /[\u0600-\u06FF]/.test(q.answer);
                                    return (
                                        <div key={i} className={`p-4 rounded-xl border-2 ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                            <div className="flex items-start">
                                                <div className={`text-2xl mr-4 mt-1 ${isCorrect ? 'text-green-500' : 'text-red-500'}`}>
                                                    {isCorrect ? <i className="fas fa-check-circle"></i> : <i className="fas fa-times-circle"></i>}
                                                </div>
                                                <div className="flex-1">
                                                    <p className="font-bold text-gray-800 mb-2">{i+1}. {q.question}</p>
                                                    <div className="flex flex-col sm:flex-row sm:items-center sm:space-x-4">
                                                        <span className="text-sm text-gray-500">Jawapan anda: </span>
                                                        <span className={`font-bold ${isCorrect ? 'text-green-700' : 'text-red-600'} ${isJawiAns ? 'jawi-text' : ''}`}>
                                                            {examAnswers[i] || 'Tidak dijawab'}
                                                        </span>
                                                    </div>
                                                    {!isCorrect && (
                                                        <div className="flex flex-col sm:flex-row sm:items-center sm:space-x-4 mt-1">
                                                            <span className="text-sm text-gray-500">Jawapan sebenar: </span>
                                                            <span className={`font-bold text-green-700 ${isJawiAns ? 'jawi-text' : ''}`}>{q.answer}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <button 
                                onClick={() => navigate('exam-menu')}
                                className="w-full bg-gray-800 text-white py-4 rounded-full font-bold text-lg hover:bg-gray-700 transition"
                            >
                                Kembali ke Menu Peperiksaan
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div>
                    {view === 'home' && renderHome()}
                    {view === 'bidang' && renderBidang()}
                    {view === 'game' && renderGame()}
                    {view === 'report' && renderReport()}
                    {view === 'exam-menu' && renderExamMenu()}
                    {view === 'exam-engine' && renderExamEngine()}
                    {view === 'exam-result' && renderExamResult()}
                </div>
            );
        };

        const QuizGame = ({ data, onComplete }) => {
            const [selected, setSelected] = React.useState(null);
            const [status, setStatus] = React.useState(null); 

            const handleSelect = (option) => {
                if (status === 'correct') return;
                setSelected(option);
                
                if (option === data.answer) {
                    setStatus('correct');
                    setTimeout(() => onComplete(true), 1500);
                } else {
                    setStatus('wrong');
                    setTimeout(() => { setSelected(null); setStatus(null); }, 1000);
                }
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {data.options.map((opt, i) => {
                        let btnClass = "bg-blue-50 hover:bg-blue-100 text-blue-900 border-2 border-blue-200";
                        if (selected === opt) {
                            if (status === 'correct') btnClass = "bg-green-500 text-white border-green-600 pulse-correct";
                            if (status === 'wrong') btnClass = "bg-red-500 text-white border-red-600 shake-wrong";
                        }
                        
                        const isJawi = data.isJawiAnswer || /[\u0600-\u06FF]/.test(opt);

                        return (
                            <button 
                                key={i}
                                onClick={() => handleSelect(opt)}
                                className={`p-6 rounded-2xl text-xl font-bold transition-all transform hover:-translate-y-1 ${btnClass} ${isJawi ? 'jawi-text text-center' : ''}`}
                            >
                                {opt}
                            </button>
                        );
                    })}
                </div>
            );
        };

        const MatchGame = ({ data, onComplete }) => {
            const [leftItems, setLeftItems] = React.useState([]);
            const [rightItems, setRightItems] = React.useState([]);
            
            React.useEffect(() => {
                const left = data.pairs.map(p => ({ id: Math.random(), text: p.a, matchKey: p.a }));
                const right = data.pairs.map(p => ({ id: Math.random(), text: p.b, matchKey: p.a }));
                setLeftItems(left.sort(() => Math.random() - 0.5));
                setRightItems(right.sort(() => Math.random() - 0.5));
            }, [data]);

            const [selectedLeft, setSelectedLeft] = React.useState(null);
            const [selectedRight, setSelectedRight] = React.useState(null);
            const [matchedKeys, setMatchedKeys] = React.useState([]);
            const [errorState, setErrorState] = React.useState(false);

            React.useEffect(() => {
                if (selectedLeft && selectedRight) {
                    if (selectedLeft.matchKey === selectedRight.matchKey) {
                        const newMatches = [...matchedKeys, selectedLeft.matchKey];
                        setMatchedKeys(newMatches);
                        setSelectedLeft(null);
                        setSelectedRight(null);
                        
                        if (newMatches.length === data.pairs.length) {
                            setTimeout(() => onComplete(true), 1000);
                        }
                    } else {
                        setErrorState(true);
                        setTimeout(() => {
                            setSelectedLeft(null);
                            setSelectedRight(null);
                            setErrorState(false);
                        }, 800);
                    }
                }
            }, [selectedLeft, selectedRight]);

            return (
                <div className={`grid grid-cols-2 gap-4 md:gap-12 ${errorState ? 'shake-wrong' : ''}`}>
                    <div className="flex flex-col space-y-4">
                        {leftItems.map((item) => {
                            const isMatched = matchedKeys.includes(item.matchKey);
                            const isSelected = selectedLeft?.id === item.id;
                            const isJawi = /[\u0600-\u06FF]/.test(item.text);
                            return (
                                <button 
                                    key={item.id}
                                    onClick={() => !isMatched && setSelectedLeft(item)}
                                    className={`p-4 rounded-xl font-bold border-2 text-center transition-all min-h-[80px] flex items-center justify-center
                                        ${isMatched ? 'matched' : isSelected ? 'selected-match bg-amber-50' : 'bg-white hover:bg-gray-50 border-gray-200'}
                                        ${isJawi ? 'jawi-text' : 'text-lg text-gray-700'}`}
                                >
                                    {item.text}
                                </button>
                            );
                        })}
                    </div>
                    <div className="flex flex-col space-y-4">
                        {rightItems.map((item) => {
                            const isMatched = matchedKeys.includes(item.matchKey);
                            const isSelected = selectedRight?.id === item.id;
                            const isJawi = /[\u0600-\u06FF]/.test(item.text);
                            return (
                                <button 
                                    key={item.id}
                                    onClick={() => !isMatched && setSelectedRight(item)}
                                    className={`p-4 rounded-xl font-bold border-2 text-center transition-all min-h-[80px] flex items-center justify-center
                                        ${isMatched ? 'matched' : isSelected ? 'selected-match bg-amber-50' : 'bg-white hover:bg-gray-50 border-gray-200'}
                                        ${isJawi ? 'jawi-text' : 'text-lg text-gray-700'}`}
                                >
                                    {item.text}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const SequenceGame = ({ data, onComplete }) => {
            const [shuffledItems, setShuffledItems] = React.useState([]);
            const [userSequence, setUserSequence] = React.useState([]);
            
            React.useEffect(() => {
                const items = data.items.map(item => ({ id: Math.random(), text: item }));
                setShuffledItems(items.sort(() => Math.random() - 0.5));
                setUserSequence(Array(data.items.length).fill(null));
            }, [data]);

            const handlePick = (item) => {
                const firstEmpty = userSequence.findIndex(s => s === null);
                if (firstEmpty !== -1) {
                    const newSeq = [...userSequence];
                    newSeq[firstEmpty] = item;
                    setUserSequence(newSeq);
                    setShuffledItems(shuffledItems.filter(i => i.id !== item.id));
                }
            };

            const handleRemove = (index) => {
                const item = userSequence[index];
                if (item) {
                    const newSeq = [...userSequence];
                    newSeq[index] = null;
                    setUserSequence(newSeq);
                    setShuffledItems([...shuffledItems, item]);
                }
            };

            const checkAnswer = () => {
                const currentAns = userSequence.map(i => i ? i.text : null);
                const isCorrect = currentAns.every((val, index) => val === data.answer[index]);
                if (isCorrect) {
                    onComplete(true);
                } else {
                    const items = data.items.map(item => ({ id: Math.random(), text: item }));
                    setShuffledItems(items.sort(() => Math.random() - 0.5));
                    setUserSequence(Array(data.items.length).fill(null));
                    
                    const container = document.getElementById('sequence-container');
                    if (container) {
                        container.classList.add('shake-wrong');
                        setTimeout(() => container.classList.remove('shake-wrong'), 500);
                    }
                }
            };

            const allFilled = userSequence.every(i => i !== null);

            return (
                <div id="sequence-container" className="flex flex-col items-center">
                    <div className="w-full bg-blue-50 p-4 rounded-2xl min-h-[100px] mb-8 flex flex-wrap justify-center gap-3">
                        {shuffledItems.map(item => {
                            const isJawi = /[\u0600-\u06FF]/.test(item.text);
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => handlePick(item)}
                                    className={`bg-white border-2 border-blue-300 px-4 py-2 rounded-lg font-bold shadow-sm hover:bg-blue-100 transition-colors ${isJawi ? 'jawi-text' : ''}`}
                                >
                                    {item.text}
                                </button>
                            );
                        })}
                        {shuffledItems.length === 0 && <span className="text-gray-400 font-bold self-center">Susun di bawah 👇</span>}
                    </div>

                    <div className="w-full flex flex-col space-y-3 mb-6" dir={/[\u0600-\u06FF]/.test(data.answer[0]) ? 'rtl' : 'ltr'}>
                        {userSequence.map((item, index) => {
                            return (
                                <div 
                                    key={index} 
                                    onClick={() => handleRemove(index)}
                                    className={`w-full min-h-[60px] border-4 border-dashed rounded-xl flex items-center justify-center p-3 cursor-pointer transition-colors
                                        ${item ? 'border-primary bg-indigo-50 border-solid shadow-md' : 'border-gray-300 bg-gray-50'}`}
                                >
                                    {item ? (
                                        <span className={`font-bold ${/[\u0600-\u06FF]/.test(item.text) ? 'jawi-text text-primary' : 'text-gray-800'}`}>
                                            {item.text}
                                        </span>
                                    ) : (
                                        <span className="text-gray-300 text-sm font-bold">Ruang {index + 1}</span>
                                    )}
                                </div>
                            )
                        })}
                    </div>

                    {allFilled && (
                        <button 
                            onClick={checkAnswer}
                            className="bg-primary text-white px-8 py-3 rounded-full font-bold text-xl shadow-lg hover:bg-indigo-700 transition pulse-correct"
                        >
                            Semak Jawapan
                        </button>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
